[project]
name = "brightpan-invoice-extraction"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.15.0",
    "fastapi>=0.148.0",
    "httpx>=0.28.1",
    "pillow>=13.0.0",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.14.1",
    "pypdf>=6.21.1",
    "pypdfium2>=5.14.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
